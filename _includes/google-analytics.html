{% if site.google_analytics and site.google_analytics_enabled and site.google_tag_manager == nil %}
<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{ site.google_analytics }}', {
    page_location: window.location.href,
    page_title: document.title,
    page_path: window.location.pathname
  });

  window.__sendSiteAnalyticsEvent = function(eventName, params) {
    if (typeof window.gtag === 'function') {
      window.gtag('event', eventName, Object.assign({
        page_location: window.location.href,
        page_title: document.title,
        page_path: window.location.pathname,
        page_date: {{ page.date | date: "%Y-%m-%d" | jsonify }}
      }, params || {}));
    }
  };

  window.__trackPageViewIfConsented = function() {
    const consentStorageKey = 'google-consent-mode';
    let consent = null;

    try {
      const saved = window.localStorage ? window.localStorage.getItem(consentStorageKey) : null;
      consent = saved ? JSON.parse(saved) : null;
    } catch (error) {
      consent = null;
    }

    const hasValidExpiry = consent && typeof consent.expiry === 'string' && !Number.isNaN(new Date(consent.expiry).getTime());
    const isGranted = !!(consent && consent.granted === true && hasValidExpiry && new Date(consent.expiry) > new Date());

    if (isGranted && typeof window.gtag === 'function') {
      window.__sendSiteAnalyticsEvent('page_view', {
        page_type: {{ layout.name | default: "page" | jsonify }},
        page_category: {{ page.categories | first | default: "general" | jsonify }}
      });
    }
  };

  document.addEventListener('DOMContentLoaded', function() {
    window.__trackPageViewIfConsented();
  });
</script>
{% endif %}
