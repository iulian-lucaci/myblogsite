---
layout: page
title: "Search"
background: '/img/bg-category.jpg'
permalink: /search/
---

<div id="search-container">
  <input type="text" id="search-input" placeholder="Search posts...">
  <div id="search-results"></div>
</div>

<script>
// Load search data
let searchData = [];

fetch('{{ "/search.json" | relative_url }}')
  .then(response => response.json())
  .then(data => {
    searchData = data;
  });

// Search function
function performSearch(query) {
  const resultsDiv = document.getElementById('search-results');
  const siteBaseUrl = '{{ site.baseurl }}';
  
  if (!query.trim()) {
    resultsDiv.innerHTML = '';
    return;
  }
  
  const lowerQuery = query.toLowerCase();
  const results = searchData.filter(post => {
    const title = (post.title || '').toString().toLowerCase();
    const excerpt = (post.excerpt || '').toString().toLowerCase();
    const category = (post.category || '').toString().toLowerCase();
    return title.includes(lowerQuery) || excerpt.includes(lowerQuery) || category.includes(lowerQuery);
  });
  
  resultsDiv.innerHTML = '';

  if (results.length === 0) {
    const emptyState = document.createElement('p');
    emptyState.textContent = 'No results found.';
    resultsDiv.appendChild(emptyState);
    return;
  }

  const list = document.createElement('ul');

  results.forEach(post => {
    const item = document.createElement('li');
    item.className = 'search-result-item';

    const image = post.image || '';
    if (image) {
      const thumbLink = document.createElement('a');
      thumbLink.className = 'search-thumb-link';
      thumbLink.href = `${siteBaseUrl}${post.url}`;

      const thumb = document.createElement('img');
      thumb.className = 'search-thumb';
      thumb.src = `${siteBaseUrl}${image}`;
      thumb.alt = post.title || '';

      thumbLink.appendChild(thumb);
      item.appendChild(thumbLink);
    }

    const body = document.createElement('div');
    body.className = 'search-result-body';

    const resultLink = document.createElement('a');
    resultLink.href = `${siteBaseUrl}${post.url}`;

    const title = document.createElement('strong');
    title.textContent = post.title || '';
    resultLink.appendChild(title);
    body.appendChild(resultLink);

    const excerpt = document.createElement('p');
    excerpt.textContent = `${(post.excerpt || '').substring(0, 150)}...`;
    body.appendChild(excerpt);

    const meta = document.createElement('small');
    meta.textContent = `${post.date || ''} • ${post.category || ''}`;
    body.appendChild(meta);

    item.appendChild(body);
    list.appendChild(item);
  });

  resultsDiv.appendChild(list);
}

// Search input event listener
document.getElementById('search-input').addEventListener('keyup', (e) => {
  performSearch(e.target.value);
});
</script>

<style>
#search-container {
  margin-top: 2rem;
}

#search-input {
  width: 100%;
  padding: 0.75rem;
  font-size: 1rem;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin-bottom: 1.5rem;
}

#search-results ul {
  list-style: none;
  padding: 0;
}

#search-results li {
  padding: 1rem;
  border-bottom: 1px solid #eee;
}

#search-results a {
  text-decoration: none;
  color: #007bff;
}

#search-results a:hover {
  text-decoration: underline;
}

#search-results p {
  margin: 0.5rem 0;
  color: #666;
  font-size: 0.9rem;
}

#search-results small {
  color: #999;
}

/* Thumbnail styles for search results */
.search-result-item {
  display: flex;
  gap: 1rem;
  align-items: flex-start;
}
.search-thumb {
  width: 96px;
  height: 64px;
  object-fit: cover;
  border-radius: 4px;
  flex-shrink: 0;
}
.search-result-body {
  flex: 1 1 auto;
}
.search-thumb-link { display: inline-block; }
</style>
